<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Document</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <header>
          <p><a href="../../index.html">volver a Portafolio</a></p>
        <h1> Ejercicos con node</h1>
    </header>
    <main>
        <section class="ejercicio 1">
            <h2 id="titulo-arreglos"> Arreglos del código  <code>01-arreglos.js</code></h2>

            <p>Datos de prueba con js</p>
            <div class="tabla-scroll">

            <table id="tabla-talleres">
                <thead>
                    <tr>
                        <th>Nombre</th>
                        <th>Instructor</th>
                        <th>Cupo</th>
                        <th>Inscritos</th>
                    </tr>
                </thead>

                <tbody>

                </tbody>

            </table>
            </div>

            <form id="form-arreglos" class="formulario">
                <div class="campos">
                    <label for="operacion-arreglo" name="operacion arreglo">Operacion</label>

                    <select name="operacion-arreglo" id="operacion-arreglo">

                        <option value="forEach">For-Each - Lista con nombre del taller y cupo en formato (D/T)</option>

                        <option value="map">map - Unicamente nombre de talleres </option>

                        <option value="filtrer">filtrer - Muestra los Talleres con cupo lleno</option>

                        <option value="find">find - Muestra al unico taller dado por Ing. María </option>

                        <option value="reduce">Reduce -Muestra  Total de inscritos en todos los Talleres</option>

                        <option value="filtrer-map"> Filtrer + map - Nombre de talleres con cupo disponible</option>

                    </select>
                </div>

                <button type="submit">Ejecutar</button>
            </form>

            <output class="resultado" id="resultado-arreglo" for="form-arreglo"></output>
        </section>

        <section class="ejercicio" aria-labelledby="titulo-objeto">
            <h2>Segunda parte de ejercicios manejo de Objeto sy Json</h2>
            <p>Edita el taller y elije que opercacion aplicarle: </p>

            <form class="formulario" id="form-objeto">
                <div class="campo">
                    <label for="obj-nombre">Nombre</label>
                    <input type="text" id="obj-nombre" name="obj-nombre" value="Introcucción a Python">
                </div>

                    <div class="campo campo-corta">
                    <label for="obj-instructor">Instructor</label>
                    <input type="text" id="obj-instructor" name="obj-instructor" value="Ing. María López" min="0">
                </div>

                <div class="campo">
                    <label for="obj-cupo">Cupo</label>
                    <input type="text" id="obj-cupo" name="obj-cup" value="25" min="0">
                </div>

                <div class="campo">
                    <label for="obj-inscritos">Inscritos</label>
                    <input type="text" id="obj-inscritos" name="obj-inscritos" value="25" min="0">
                </div>

                <div class="campo"> 
                    <label for="operacion-objeto">Operacion a Realizar</label>
                    <select name="operacion-objeto" id="operacion-objeto">
                        <option value="keys">Object.keys </option>
                        <option value="values">Object.values </option>
                        <option value="entries">Object.entries </option>
                        <option value="stringify"> JSON.stringify </option>
                        <option value="roundtrip"> Ida y vuelta de cadena JSON </option>


                    </select>
                </div>
                <button type="submit"> Ejectar opcion de objeto</button>
            </form>

            <output class="resultado"  id="resultado-objeto" for="form-objeto"></output>



        </section>

    </main>

    <script src="./js/apps.js"></script>
</body>
</html>
